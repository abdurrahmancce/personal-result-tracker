<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Result Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>📘 Personal Result Tracker</h2>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
      <p>Sign in to save your results and access them from any device.</p>
      <button id="loginBtn" class="google-btn" type="button">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/google.svg" alt="" class="icon"> Sign in with Google
      </button>
    </div>

    <!-- App (visible after login) -->
    <div id="appScreen" hidden>

    <div class="user-bar">
      <img id="userPhoto" alt="" hidden referrerpolicy="no-referrer">
      <span id="userName"></span>
      <button id="logoutBtn" type="button">Logout</button>
    </div>

    <!-- Form Section -->
    <form id="resultForm">
      <input type="text" id="courseCode" placeholder="Course Code" required>
      <input type="text" id="courseTitle" placeholder="Course Title">
      <input type="number" id="mid" placeholder="Mid (30)" min="0" max="30">
      <input type="number" id="ct" placeholder="CT (10)" min="0" max="10">
      <input type="number" id="attendance" placeholder="Attendance (10)" min="0" max="10">
      <input type="number" id="final" placeholder="Final (50)" min="0" max="50">
      <button type="submit">Add Result</button>
    </form>

    <!-- CGPA Card -->
    <div class="cgpa-card">
      <h3>CGPA: <span id="cgpa">0.00</span></h3>
    </div>

    <!-- Result Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Course Code</th>
            <th>Course Title</th>
            <th>Mid (30)</th>
            <th>CT (10)</th>
            <th>Attendance (10)</th>
            <th>Final (50)</th>
            <th>Total</th>
            <th>Grade</th>
            <th>GPA</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="resultTable"></tbody>
      </table>
    </div>

    </div><!-- /appScreen -->

    <!-- About Me Card -->
    <div class="about-me-card">
      <h3>Abdur Rahman</h3>
      <p>
        <a href="https://github.com/abdurrahmancce" target="_blank" class="icon-link">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub" class="icon"> GitHub
        </a> |
        <a href="https://www.linkedin.com/in/abdur-rahman-akash-60450b2aa" target="_blank" class="icon-link">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn" class="icon"> LinkedIn
        </a> |
        <a href="mailto:akash.abdur.2002@gmail.com" class="icon-link">
          <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="Email" class="icon"> Email Me
        </a>
      </p>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
